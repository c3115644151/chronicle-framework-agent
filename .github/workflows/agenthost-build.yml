name: Agent host build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: dotnet build (agenthost)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build the agent host
        run: dotnet build Dev/ChronicleFramework/agenthost/ChronicleAgentHost.csproj -c Release --nologo
