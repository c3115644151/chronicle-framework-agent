name: Documentation gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  docs:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate documentation routing and harness contracts
        shell: pwsh
        run: ./Dev/ChronicleFramework/harness/Check-Docs.ps1
